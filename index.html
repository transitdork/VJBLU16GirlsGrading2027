  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js', {scope:'./'}).then(reg => {
        reg.update();
        reg.addEventListener('updatefound', () => {
          const next = reg.installing;
          if (next) next.addEventListener('statechange', () => { if (next.state === 'installed' && navigator.serviceWorker.controller) next.postMessage('activate'); });
        });
      }).catch(() => {});
      let refreshed = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (!refreshed) { refreshed = true; location.reload(); } });

    }
